# =============================================================================
#  MSIG website — Jekyll configuration
#  Most day-to-day content lives in _data/*.yml — you rarely need to touch this
#  file. Edit this only to change site-wide identity (title, URL, social links).
#  NOTE: changes to _config.yml require a server restart when running locally.
# =============================================================================

# ---- Site identity (used in <title>, SEO tags, footer) ----
title: Multimodal Spatial Imaging Group
short_name: MSIG
description: >-
  The Multimodal Spatial Imaging Group (MSIG) at the University of Calgary
  develops precision measurement methods and rigorous mathematical models for 3D
  reality capture using diverse imaging sensors — terrestrial laser scanners,
  cameras, range cameras, LiDAR, and fluoroscopic imagers.
tagline: Department of Geomatics Engineering · Schulich School of Engineering · University of Calgary

# ---- Deployment (https://www.msig.ca) ----
# url    = the protocol + domain your site is served from. This MUST be the
#          custom domain: multimodalsig.github.io 301-redirects here, so
#          pointing it at the old address made every page declare a canonical
#          URL that redirects away from itself. Google resolves the favicon
#          from whichever home page it treats as canonical.
# baseurl = subpath, e.g. "/repo-name". Leave EMPTY for a site served at the
#           domain root.
url: https://www.msig.ca
baseurl: ""

# ---- Branding ----
lang: en
copyright_holder: Multimodal Spatial Imaging Group
institution: University of Calgary
department: Department of Geomatics Engineering
faculty: Schulich School of Engineering

# ---- SEO / social ----
author:
  name: Multimodal Spatial Imaging Group
twitter:
  card: summary_large_image
logo: /assets/img/main_logo.svg
# NOTE: this key is inert — jekyll-seo-tag reads `image`, not `social_image`, so
# no og:image is emitted and shared links get no thumbnail. The path below does
# not exist either. To fix, add a wide raster (~1200x630) and set `image:` to it;
# the SVG logo is not a substitute. See "Known gaps" in the README.
social_image: /assets/img/1.jpg

# ---- Plugins (all on the GitHub Pages allow-list — native build, no Actions) ----
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# ---- Sass ----
sass:
  style: compressed
  sass_dir: _sass

# ---- Build ----
markdown: kramdown
permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .gitignore
  - LICENSE
  - tools
  - node_modules
