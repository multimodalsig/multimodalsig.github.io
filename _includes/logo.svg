{%- comment -%}
  The group mark for use in the page, inlined so the site's dark-mode toggle can
  recolour it. An <img> would render the SVG in its own document, where
  --logo-ink is not visible, and the brand teal is 1.7:1 on the dark navbar.

  Artwork is assets/img/main_logo.svg with the two brand colours swapped for
  variables — keep the two in step. That file stays the canonical mark for the
  SEO publisher logo; assets/img/tab_logo.svg is the favicon and
  assets/img/main_logo_background.svg is the version on a teal chip.

  Decorative here: the group name sits beside it, so it is aria-hidden rather
  than announced twice.
{%- endcomment -%}
<svg class="logo-mark" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
  <path d="M 182.2 131.5 A 88 88 0 0 1 34.8 159.1" fill="none" stroke="var(--logo-ink)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 19.8 136.1 A 88 88 0 1 1 187.9 104.6" fill="none" stroke="var(--logo-ink)" stroke-width="7" stroke-linecap="round"/>
  <g stroke="var(--logo-ink)" stroke-width="2.5" opacity="0.85">
    <line x1="54.0" y1="60.0" x2="72.0" y2="138.4"/>
    <line x1="54.0" y1="60.0" x2="128.0" y2="140.7"/>
    <line x1="100.0" y1="46.0" x2="72.0" y2="138.4"/>
    <line x1="100.0" y1="46.0" x2="128.0" y2="140.7"/>
    <line x1="146.0" y1="60.0" x2="72.0" y2="138.4"/>
    <line x1="146.0" y1="60.0" x2="128.0" y2="140.7"/>
  </g>
  <polyline points="8.0,156.0 60.0,134.0 104.0,150.0 192.0,116.0" fill="none" stroke="var(--logo-accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="var(--logo-ink)">
    <circle cx="54.0" cy="60.0" r="9"/>
    <circle cx="100.0" cy="46.0" r="9"/>
    <circle cx="146.0" cy="60.0" r="9"/>
  </g>
</svg>
