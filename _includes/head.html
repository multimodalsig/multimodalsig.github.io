<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Set the saved (or system) theme before paint to avoid a flash of light. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("msig-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

  <!-- SEO: <title>, meta description, Open Graph + Twitter cards, JSON-LD.
       Generated by jekyll-seo-tag from _config.yml and each page's front matter. -->
  {% seo %}

  <!-- Fonts: Roboto (body) + Roboto Slab (headings) + Roboto Mono (code). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@100;300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap">

  <!-- Icons: Font Awesome 6 (free). -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        referrerpolicy="no-referrer">

  <!-- Site styles (compiled from _sass/ by Jekyll). -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- Favicon: the group mark (assets/img/logo.svg), redrawn for tab sizes —
       strokes and dots are thickened and the faint triangulation lines dropped,
       since at 16-32px they render as grey mush. The white disc keeps the dark
       teal legible on a dark browser tab strip. Keep this in step with logo.svg. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><circle cx='100' cy='100' r='96' fill='white'/><circle cx='100' cy='100' r='86' fill='none' stroke='%230F4A54' stroke-width='12'/><polyline points='34,152 78,133 122,148 166,127' fill='none' stroke='%23C1802B' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/><g fill='%230F4A54'><circle cx='52' cy='58' r='13'/><circle cx='100' cy='45' r='13'/><circle cx='148' cy='58' r='13'/></g></svg>">

  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
