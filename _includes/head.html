<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Set the saved (or system) theme before paint to avoid a flash of light. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("msig-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

  <!-- SEO: <title>, meta description, Open Graph + Twitter cards, JSON-LD.
       Generated by jekyll-seo-tag from _config.yml and each page's front matter. -->
  {% seo %}

  <!-- Fonts: Roboto (body) + Roboto Slab (headings) + Roboto Mono (code). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@100;300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap">

  <!-- Icons: Font Awesome 6 (free). -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        referrerpolicy="no-referrer">

  <!-- Site styles (compiled from _sass/ by Jekyll). -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- Favicon: the group mark itself, transparent background and all of its
       detail. Served from the file so it never drifts from the logo. -->
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/logo.svg' | relative_url }}">

  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
