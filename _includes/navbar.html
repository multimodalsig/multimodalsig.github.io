<div class="navbar-wrap site-nav">
  <nav class="navbar" aria-label="Primary">
    <a class="navbar__brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <div class="navbar__right">
      <div class="navbar__links" id="nav-links">
        {%- for item in site.data.navigation -%}
          <a class="navbar__link{% if page.nav == item.id %} navbar__link--active{% endif %}"
             href="{{ item.url | relative_url }}"
             {% if page.nav == item.id %}aria-current="page"{% endif %}>{{ item.label }}</a>
        {%- endfor -%}
      </div>

      <button class="theme-toggle" type="button" data-theme-toggle
              aria-label="Toggle dark mode" title="Toggle dark mode">
        <!-- Moon: shown in light mode (click → dark). -->
        <span class="theme-icon theme-icon--moon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
        <!-- Sun: shown in dark mode (click → light). -->
        <span class="theme-icon theme-icon--sun" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
        </span>
      </button>

      <button class="navbar__toggle" type="button" data-nav-toggle
              aria-controls="nav-links" aria-expanded="false" aria-label="Toggle navigation menu">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
    </div>
  </nav>
</div>
