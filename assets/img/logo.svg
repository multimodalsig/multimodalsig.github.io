<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Multimodal Spatial Imaging Group">
  <!-- Standalone mark: favicon and SEO publisher logo. The in-page copy lives in
       _includes/logo.svg, which takes its colours from the site's theme toggle —
       keep the two in step.

       The brand teal is only 1.7:1 against a dark browser tab strip, so it
       lightens to the same hue at 5.4:1 when the OS is in dark mode. Browsers
       without SVG-favicon CSS just get the brand teal, as before. -->
  <style>
    .ink { stroke: #0F4A54; }
    .ink-fill { fill: #0F4A54; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #3E9DB0; }
      .ink-fill { fill: #3E9DB0; }
    }
  </style>
  <circle class="ink" cx="100" cy="100" r="88" fill="none" stroke-width="7"/>
  <g class="ink" stroke-width="2.5" opacity="0.85">
    <line x1="52" y1="58" x2="82" y2="135"/>
    <line x1="52" y1="58" x2="126" y2="146"/>
    <line x1="100" y1="45" x2="82" y2="135"/>
    <line x1="100" y1="45" x2="126" y2="146"/>
    <line x1="148" y1="58" x2="82" y2="135"/>
    <line x1="148" y1="58" x2="126" y2="146"/>
  </g>
  <polyline points="34,152 78,133 122,148 166,127" fill="none" stroke="#C1802B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="ink-fill">
    <circle cx="52" cy="58" r="9"/>
    <circle cx="100" cy="45" r="9"/>
    <circle cx="148" cy="58" r="9"/>
  </g>
</svg>
