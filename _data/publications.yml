# Publications that are NOT in the PI's ORCID record.
#
# The Publications page builds itself from ORCID (see assets/js/site.js →
# initPublications) and fills in authors/volume/pages from Crossref. Anything
# missing from ORCID goes here instead, and is merged into the same list.
#
# These entries are NOT looked up at Crossref — what you write below is exactly
# what appears on the page and in the copied citation. If one of these later
# turns up in ORCID, the ORCID copy is dropped in favour of this entry (matched
# on DOI, or on title when there is no DOI), so nothing appears twice.
#
#  Fields:
#    title     required  Full title, no trailing period.
#    authors   required  Pre-formatted, APA style, to match the Crossref-derived
#                        entries: "Family, I. I., Family, I., & Family, I. I."
#    journal   required  Journal or proceedings name, spelled out.
#    volume    optional  Volume number.
#    issue     optional  Issue number, or the article number for article-numbered
#                        journals.
#    pages     optional  Page range, or the article/eLocator id.
#    year      required  Four-digit year, quoted.
#    month     optional  1-12, used only to order entries within a year.
#    type      optional  Defaults to journal-article. Drives the coloured badge.
#    doi       optional  Bare DOI, no https://doi.org/ prefix — the View button
#                        and the citation build the link from it.

