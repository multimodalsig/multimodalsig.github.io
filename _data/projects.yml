- id: medflow
  title: "MedFlow: CT-to-PET Image Synthesis"
  tag: Biomedical
  lead: Jackson Cooper
  lead_role: MSc Student
  lead_photo: assets/img/team/jackson.jpg
  images:
    - assets/img/gallery/ct-pet-synthesis.png
  lead_in: Synthesizing whole-body PET images from CT, and finding the limits of what CT can reveal.
  body:
    - >-
      MedFlow investigates whether a plausible whole-body FDG-PET image can be
      synthesised from a routine CT scan alone, and where that synthesis is
      limited by CT itself rather than by the model. FDG-PET reveals metabolic
      activity decisive for cancer detection, staging, and treatment monitoring,
      yet remains scarce relative to the near-ubiquitous CT.
    - >-
      A 2.5D rectified flow model trained on the whole-body AutoPET cohort
      reproduces normal anatomy with high fidelity but systematically
      under-predicts per-lesion tumour uptake (SUV), which proves largely
      unrecoverable from CT appearance. Formalised through the data processing
      inequality, this establishes an information-theoretic ceiling on CT-only
      quantitative PET synthesis, reframing the shortfall not as a model failure
      but as a measurable limit of the modality.
  methods:
    - Rectified-flow generative models
    - 2.5D synthesis
    - AutoPET cohort
    - Information theory

- id: mobile-mapping-network
  title: Mobile Mapping Network Design for Indoor Scanning
  tag: Mobile Mapping
  lead: Abdoul Karim Ouangre
  lead_role: PhD Student
  lead_photo: assets/img/team/karim.png
  images:
    - assets/img/projects/vp_plan.png
  lead_in: Optimizing where and how a mobile scanner moves through indoor spaces.
  body:
    - >-
      This project develops network design methodologies for mobile scanning
      systems used in indoor mapping applications. It focuses on optimizing data
      acquisition workflows, viewpoint planning, and spatial coverage and
      uncertainty to improve the quality and efficiency of indoor geospatial data
      collection.
    - >-
      The goal is to support more reliable and accurate indoor mapping solutions
      for a variety of built-environment applications.
  methods:
    - Network design
    - Viewpoint planning
    - Indoor mapping

- id: rtls-lidar-fusion
  title: RTLS and Mobile LiDAR Sensor Fusion
  tag: Sensor Fusion
  lead: Abdoul Karim Ouangre
  lead_role: PhD Student
  lead_photo: assets/img/team/karim.png
  images:
    - assets/img/gallery/field-scanner-river.jpg
  lead_in: Fusing real-time location systems with mobile LiDAR to tame drift.
  body:
    - >-
      This project investigates the integration of Real-Time Location Systems
      (RTLS) with mobile LiDAR platforms to improve positioning accuracy and
      overall point cloud quality. By combining complementary sensor
      technologies, the research aims to reduce drift and enhance the geometric
      reliability of mobile mapping datasets.
    - >-
      The work supports the development of more robust indoor and complex
      environment mapping workflows.
  methods:
    - RTLS
    - Mobile LiDAR
    - Sensor fusion

- id: lidar-gaussian-splatting
  title: LiDAR-Constrained Gaussian Splatting for BIM and HBIM
  tag: 3D Reconstruction
  lead: Abdoul Karim Ouangre
  lead_role: PhD Student
  lead_photo: assets/img/team/karim.png
  images:
    - assets/img/projects/lidar_gauss.png
  lead_in: Constraining Gaussian Splatting with LiDAR for accurate, scalable digital twins.
  body:
    - >-
      This research direction integrates LiDAR point clouds with Gaussian
      Splatting workflows to improve the geometric accuracy of 3D scene
      reconstruction. The objective is to leverage LiDAR-derived constraints
      during Gaussian generation, creating more accurate and scalable digital
      representations that can be captured using consumer devices such as
      smartphones.
    - >-
      Future applications include BIM and HBIM workflows, semantic scene
      understanding, and automated extraction of architectural elements through
      computer vision and segmentation techniques.
  methods:
    - Gaussian Splatting
    - Mobile LiDAR
    - BIM / HBIM
