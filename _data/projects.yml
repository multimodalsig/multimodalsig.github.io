# =============================================================================
#  PROJECTS, shown on the Research page (Projects tab) as expandable cards.
#  Descriptions are taken from the team members' own write-ups (content/team).
#
#  To add a project: copy a block, fill it in, drop any images in
#  assets/img/projects/ and reference them under `images`.
#
#  Fields:
#    id        required, unique slug (lowercase, no spaces).
#    title     required.
#    tag       required, short category label (the pill on the card).
#    lead      required, lead researcher's name.
#    lead_role required, e.g. "PhD Student".
#    lead_photo optional, path under assets/img/ for the lead's avatar.
#    images    required, list of image paths under assets/img/.
#    lead_in   required, one-sentence hook (shown collapsed).
#    body      required, list of paragraphs (shown expanded).
#    methods   optional, list of keyword tags.
#    metric    optional, { value, label } headline figure.
# =============================================================================

- id: uc3d
  title: "UC3D: Low-Cost 3D Mapping and Heritage Documentation"
  tag: Heritage
  lead: Abdelrahman Abdelghany
  lead_role: PhD Student
  lead_photo: assets/img/team/abdel.jpeg
  images:
    - assets/img/projects/uc3d_1.png
  lead_in: A smartphone-based platform that makes accurate 3D reality capture accessible and scalable.
  body:
    - >-
      UC3D is a smartphone-based 3D mapping platform that combines mobile
      sensors, LiDAR, and AI methods to generate accurate 3D models. The system
      is being applied to document and preserve heritage assets in collaboration
      with Parks Canada, supporting digital archiving, condition assessment, and
      disaster preparedness.
    - >-
      The project aims to provide a practical, low-cost alternative to
      traditional reality capture systems.
  methods:
    - Smartphone LiDAR
    - Photogrammetry
    - AI depth estimation
    - HBIM

- id: change-detection
  title: Point Cloud Change Detection and Deterioration Analysis
  tag: Monitoring
  lead: Abdelrahman Abdelghany
  lead_role: PhD Student
  lead_photo: assets/img/team/abdel.jpeg
  images:
    - assets/img/projects/uc3d_2.png
  lead_in: Detecting structural change and surface deterioration across time.
  body:
    - >-
      This project develops methods for detecting structural changes and surface
      deterioration from multi-temporal point clouds. By combining geometric
      analysis with AI-based feature extraction, the research supports heritage
      conservation, infrastructure monitoring, and damage assessment.
  methods:
    - Multi-temporal point clouds
    - Geometric analysis
    - AI feature extraction

- id: beyond-checkerboards
  title: Beyond Checkerboards
  tag: Calibration
  lead: Akshay Bharadwaj
  lead_role: Postdoctoral Researcher
  lead_photo: assets/img/team/akshay.jpeg
  images:
    - assets/img/projects/checker.jpg
  lead_in: Re-examining camera calibration by measuring what actually matters downstream.
  body:
    - >-
      Photogrammetric self-calibration is compared against checkerboard-based
      closed-form calibration across downstream tasks, including
      structure-from-motion reconstruction, monocular visual odometry, and novel
      view synthesis.
    - >-
      The evaluation is further extended to benchmark datasets, where
      photogrammetric self-calibration is compared against manufacturer-provided
      calibration parameters.
  methods:
    - Self-calibration
    - Structure-from-Motion
    - Visual Odometry
    - Novel View Synthesis

- id: reindeer
  title: Non-Invasive Reindeer Antler Reconstruction
  tag: 3D Reconstruction
  lead: Julian Cramb
  lead_role: MSc Student
  lead_photo: assets/img/team/julian.jpg
  images:
    - assets/img/gallery/antler-pointcloud.jpg
  lead_in: An automated optical pipeline that measures antlers in the field, without contact.
  body:
    - >-
      This thesis project develops an automated, non-invasive 3D reconstruction
      pipeline to measure reindeer antlers, addressing the limitations of
      previous measurement methods. By combining a multi-camera optical setup
      with Gaussian Splatting, the system overcomes data-quality challenges
      caused by animal movement and inconsistent lighting.
    - >-
      Initial laboratory testing yielded a mean cloud-to-cloud distance of 3.4 to
      3.7 mm compared to reference laser scans, and the system is now deployed in
      the field for multi-season collection. Ultimately, this scalable pipeline
      will provide high-quality 3D datasets to advance interdisciplinary research
      across biodiversity, environmental monitoring, and regenerative medicine.
  methods:
    - Multi-camera capture
    - Gaussian Splatting
    - Point-cloud comparison
  metric:
    value: 3.4 to 3.7 mm
    label: mean cloud-to-cloud vs. laser scan

