# ---- Instrumentation groups -------------------------------------------------
instruments:
  - icon: fa-solid fa-satellite-dish
    title: Terrestrial Laser Scanners
    items:
      - Survey-grade TLS
      - Time-of-flight long-range scanner
      - Reference target sets & tribrachs
  - icon: fa-solid fa-camera
    title: Cameras & Imaging Sensors
    items:
      - Passive and metric cameras
      - Time-of-flight range cameras
      - Thermal & panoramic sensors
  - icon: fa-solid fa-mobile-screen
    title: Mobile & Smartphone Capture
    items:
      - LiDAR-equipped smartphones
      - Handheld SLAM scanner
