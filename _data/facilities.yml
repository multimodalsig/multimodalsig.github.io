# ---- Feature: the core lab --------------------------------------------------
lab:
  tag: Core facility
  name: Geo-Spatial Vision Metrology (GeoVM) Laboratory
  image: assets/img/facilities/geovm-panorama.jpg
  # Set for panoramas and other very wide shots: the image spans the full width
  # of the viewport with the text underneath, instead of sitting in a 300px
  # column beside it where a wide image gets cropped to its middle third.
  # Unset it and the photo goes back in the card, side by side with the text.
  image_wide: true
  description: >-
    The walls and ceiling contain some 500 signalized targets of different sizes
    used for instrument calibration, orientation, and performance evaluation.
    Several sizes of targets have been placed throughout the room to allow
    experiments to be performed with a wide range of imaging sensors such as
    passive cameras, time-of-flight range cameras, gaming sensors, laser
    scanners, and thermal cameras, and sensors with different fields of view,
    frame imaging cameras, and panoramic sensors. The constant temperature
    control in the room and the ability to control ambient light with light
    switches and blinds allow us to conduct high-precision metrology experiments.

