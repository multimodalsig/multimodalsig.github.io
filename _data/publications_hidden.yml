# Works that are in the PI's ORCID record but should NOT appear on the
# Publications page — editorials, errata, duplicate ORCID entries and the like.
#
# Match on `doi` (preferred — exact and stable) or on `title` (compared
# case- and punctuation-insensitively). `note` is for whoever reads this next;
# the site ignores it.
