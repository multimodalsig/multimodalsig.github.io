name: Sync publications

# Refresh _data/publications_generated.yml from the PI's ORCID record and
# Crossref, commit it if anything changed, and then deploy. The deploy has to be
# called explicitly — see the note on the deploy job below.
#
# The fetch deliberately does NOT happen during the site build. The build runs
# on every push, and if it depended on these two APIs, then any deploy while
# ORCID or Crossref was down would ship an empty publication list — you could
# not fix a typo on the Contact page without collateral damage. Keeping the data
# committed means the build never touches the network, a failed sync is loud and
# harmless, and Crossref regressions show up in a commit diff instead of
# silently changing what visitors see.
#
# Weekly is deliberate: ORCID records change a handful of times a year, and a
# daily run would only add bot commits. Use "Run workflow" for a paper that
# needs to appear now.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-publications
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      # Exits non-zero if ORCID returns nothing, or if the list would lose more
      # than 20% of its entries, rather than committing a truncated page.
      - name: Sync from ORCID and Crossref
        run: python tools/sync_publications.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- _data/publications_generated.yml; then
            echo "No change — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications_generated.yml
          git commit -m "Sync publications from ORCID"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # The commit above will NOT start the Deploy site workflow on its own: GitHub
  # suppresses workflow triggers for pushes made with the default GITHUB_TOKEN,
  # to stop workflows setting each other off in a loop. So call the deploy
  # explicitly, and only when there was actually something new to publish.
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
