name: Deploy site

# Build the Jekyll site and deploy it to GitHub Pages using the official Pages
# deployment (actions/deploy-pages). This repo's Pages is configured with
# build_type "workflow", so this is the mechanism that actually goes live at
# https://multimodalsig.github.io.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by "Sync publications" after it commits a new publication list. A
  # push made with the default GITHUB_TOKEN does not start other workflows, so
  # that job cannot rely on its own push landing here.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Always build main's current head. When this workflow is *called* by
          # "Sync publications", the default ref is the SHA that triggered the
          # caller — main as it was before the sync commit — so we would deploy
          # the very data the sync just replaced.
          ref: main

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
