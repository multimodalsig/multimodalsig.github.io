name: Deploy site

# Build the Jekyll site on every push to main and publish the result to the
# gh-pages branch, which GitHub Pages serves at https://multimodalsig.github.io.
# (No Pages setting changes needed: the source stays "Deploy from a branch:
# gh-pages / root".)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only one deploy at a time; newer pushes cancel in-flight runs.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # enable_jekyll defaults to false, so a .nojekyll file is added and
          # GitHub Pages serves the pre-built output as-is (no second Jekyll
          # pass, which was dropping files and causing 404s).
